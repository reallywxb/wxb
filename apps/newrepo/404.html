<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404</title>
    <style>
      @keyframes error404animation {
        0% {
          transform: rotateZ(0deg);
        }

        20% {
          transform: rotateZ(-60deg);
        }

        40% {
          transform: rotateZ(-10deg);
        }

        60% {
          transform: rotateZ(50deg);
        }

        80% {
          transform: rotateZ(-20deg);
        }

        100% {
          transform: rotateZ(0deg);
        }
      }

      .error404-body-con {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 700px;
        height: 500px;
        transform: translate(-50%, -50%);
      }

      .error404-body-con-title {
        height: 260px;
        margin-top: 40px;
        font-size: 240px;
        font-weight: 700;
        line-height: 260px;
        color: #2d8cf0;
        text-align: center;
      }

      .error404-body-con-title span {
        display: inline-block;
        font-size: 230px;
        color: #19be6b;
        animation: error404animation 3s ease 0s infinite alternate;
      }

      .error404-body-con-message {
        display: block;
        font-size: 30px;
        font-weight: 500;
        color: #dddde2;
        text-align: center;
        letter-spacing: 12px;
      }

      .error404-btn-con {
        padding: 20px 0;
        margin-bottom: 40px;
        text-align: center;
      }

      .myButton {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        font-size: 14px;
        color: #222;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        background-color: rgb(0 0 0 / 10%);
        border: none;
        border-radius: 4px;
        transition: all 0.3s;
      }

      .myButton:hover {
        background-color: rgb(0 0 0 / 20%);
      }

      .myButton:active {
        background-color: rgb(0 0 0 / 30%);
      }

      .primary {
        color: #fff;
        background-color: #2682eb;
      }

      .primary:hover {
        background-color: #1a6fcf;
      }

      .primary:active {
        background-color: #1d64b4;
      }
    </style>
  </head>

  <body>
    <div class="error404">
      <div class="error404-body-con">
        <div class="box-card">
          <div class="error404-body-con-title">4 <span>0</span>4</div>
          <p class="error404-body-con-message">
            YOU&nbsp;&nbsp;LOOK&nbsp;&nbsp;LOST
          </p>
          <div class="error404-btn-con">
            <button
              id="goHome"
              class="myButton primary"
              size="large"
              style="width: 200px; cursor: pointer"
              type="text"
            >
              返回首页
            </button>
            <button
              id="goBack"
              class="myButton primary"
              size="large"
              style="width: 200px; margin-left: 40px"
              type="primary"
            >
              返回上一页
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    let goHome = document.getElementById('goHome');
    let goBack = document.getElementById('goBack');
    goHome.addEventListener('click', () => {
      window.location.href = '/spd/';
    });
    goBack.addEventListener('click', () => {
      window.history.back();
    });
  </script>
</html>
